<title>Studify – Belajar Lebih Pintar dengan AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f4ff;--surface:#ffffff;--surface2:#efedff;--text:#1d1b3a;--muted:#6b6a8a;--border:#e2e0f5;
  --primary:#6c4cf1;--primary2:#8f6bff;--accent:#12b5a6;--warn:#f59e0b;--bad:#ef4444;--good:#16a34a;
  --shadow:0 6px 24px rgba(80,60,200,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13121f;--surface:#1c1b2e;--surface2:#262440;--text:#eceaff;--muted:#a09fc4;--border:#2f2d4d;--shadow:0 6px 24px rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{--bg:#13121f;--surface:#1c1b2e;--surface2:#262440;--text:#eceaff;--muted:#a09fc4;--border:#2f2d4d;--shadow:0 6px 24px rgba(0,0,0,.4);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.5px;cursor:pointer}
.logoimg{width:40px;height:auto;display:block}
.mascot{width:120px;height:auto;display:block;margin:0 auto 10px;animation:flt 3.2s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px) rotate(-3deg)}}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.grow{flex:1}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;cursor:pointer}
nav.tabs{max-width:1040px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
nav.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{max-width:1040px;margin:auto;padding:18px 16px 60px}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.4px}
h2{font-size:24px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2) 55%,var(--accent));color:#fff;border-radius:24px;padding:28px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.15}
.hero p{max-width:520px;opacity:.95;margin:8px 0 16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.white{background:#fff;color:var(--primary)}
.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.stat b{font-size:26px;display:block}
.stat span{color:var(--muted);font-size:13px}
.feat{cursor:pointer;transition:transform .15s}
.feat:hover{transform:translateY(-3px)}
.feat .em{font-size:28px}
.feat h3{font-size:16px;margin-top:6px}
.feat p{margin:0;color:var(--muted);font-size:13.5px}
input[type=text],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{min-height:130px;resize:vertical}
.drop{border:2px dashed var(--border);border-radius:16px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2)}
.drop.over{border-color:var(--primary);color:var(--primary)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:14px;cursor:pointer;background:var(--surface)}
.mat.on{border-color:var(--primary);background:var(--surface2)}
.mat small{color:var(--muted)}
.pill{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pill.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.md h3{font-size:18px;margin:16px 0 6px;color:var(--primary)}
.md h4{font-size:15px;margin:12px 0 4px}
.md ul{padding-left:20px;margin:6px 0}
.md p{margin:6px 0}
.md code{background:var(--surface2);padding:1px 6px;border-radius:6px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .em{font-size:40px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* chat */
.chatbox{display:flex;flex-direction:column;height:min(62vh,560px);overflow-y:auto;gap:10px;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg .md p:first-child{margin-top:0}.msg .md p:last-child{margin-bottom:0}
/* flashcard */
.fc-wrap{perspective:1200px;max-width:520px;margin:0 auto}
.fc{position:relative;height:280px;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow);overflow:auto}
.face.f{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:20px;font-weight:700}
.face.b{background:var(--surface);border:2px solid var(--accent);transform:rotateY(180deg);font-size:17px}
.tip{margin-top:12px;font-size:13.5px;background:var(--surface2);padding:8px 12px;border-radius:12px;color:var(--muted)}
.bar2{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}
/* podcast */
.line{display:flex;gap:10px;padding:10px;border-radius:14px;border:1px solid transparent}
.line.now{background:var(--surface2);border-color:var(--primary)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.av.A{background:var(--primary)}.av.B{background:var(--accent)}
.wave{display:flex;gap:3px;align-items:end;height:26px}
.wave i{width:4px;background:var(--primary);border-radius:3px;height:6px}
.wave.on i{animation:wv .8s ease-in-out infinite}
.wave.on i:nth-child(2n){animation-delay:.2s}.wave.on i:nth-child(3n){animation-delay:.4s}
@keyframes wv{50%{height:24px}}
/* quiz */
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);margin-top:8px;cursor:pointer;font-weight:500}
.opt:hover{border-color:var(--primary)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
/* timer */
.ring{width:220px;height:220px;margin:10px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:50;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.note{font-size:13px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
/* ===== Landing ===== */
body.landing .chip,body.landing #tabs{display:none}
body:not(.landing) .lnav{display:none}
.lnav{display:flex;gap:2px;align-items:center}
.lnav a{padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-radius:10px}
.lnav a:hover{color:var(--text);background:var(--surface2)}
@media(max-width:700px){.lnav a{display:none}}
.btn.dark{background:var(--text);color:var(--bg)}
.btn.lg{padding:14px 26px;font-size:16px;border-radius:14px}
.announce{display:block;width:fit-content;max-width:100%;margin:6px auto 22px;background:#202124;color:#fff;border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:600;cursor:pointer;text-align:center}
.lhero{text-align:center;padding:20px 0 6px}
.lhero h1{font-size:clamp(32px,7vw,58px);font-weight:800;line-height:1.08;letter-spacing:-1.5px;margin:0 auto 14px;max-width:820px}
.hl{background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.lhero p{max-width:580px;margin:0 auto 24px;color:var(--muted);font-size:17px}
.demo{margin:34px auto 0;max-width:860px;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow);text-align:left}
@media(max-width:760px){.demo{grid-template-columns:1fr}}
.demo .col{background:var(--surface2);border-radius:16px;padding:14px;font-size:13.5px}
.demo .col b.t{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.slide{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.sec{margin-top:76px}
.sec h2{font-size:clamp(24px,4vw,34px);text-align:center;font-weight:800;letter-spacing:-.8px}
.sec>.sub{text-align:center;max-width:560px;margin:0 auto 24px}
.path{display:flex;flex-direction:column;gap:6px;padding:20px;border:1px solid var(--border);border-radius:20px;background:var(--surface);cursor:pointer;transition:.2s}
.path:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow)}
.path .em{font-size:32px}.path h3{font-size:17px;margin:0}.path p{margin:0;color:var(--muted);font-size:14px}.path small{color:var(--primary);font-weight:700;margin-top:4px}
.marq{overflow:hidden;white-space:nowrap;margin-top:38px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marq div{display:inline-block;animation:mq 26s linear infinite}
.marq span{display:inline-block;margin:0 8px;padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
@keyframes mq{to{transform:translateX(-50%)}}
.pain{text-align:center}.pain .em{font-size:46px}.pain h3{font-size:18px;margin:6px 0}.pain p{color:var(--muted);margin:0;font-size:14.5px}
.ftabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.show{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
@media(max-width:760px){.show{grid-template-columns:1fr}}
.show h3{font-size:clamp(22px,3.5vw,30px);font-weight:800;letter-spacing:-.6px}
.show ul{padding-left:20px;color:var(--muted)}
.mock{background:var(--surface2);border-radius:22px;padding:18px;border:1px solid var(--border)}
.cmpwrap{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.cmp th,.cmp td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--border)}
.cmp th{color:var(--muted);font-size:13px}
.cmp td:nth-child(2){color:var(--muted)}.cmp td:nth-child(3){font-weight:700;color:var(--primary)}
.step{text-align:center}.step .n{width:44px;height:44px;margin:0 auto 10px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:800}
.step p{color:var(--muted);margin:0;font-size:14.5px}
details.faq{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--surface);margin-bottom:10px;max-width:760px;margin-left:auto;margin-right:auto}
details.faq summary{cursor:pointer;font-weight:700}
details.faq p{margin:8px 0 0;color:var(--muted)}
.cta{background:#202124;color:#fff;border-radius:28px;text-align:center;padding:46px 20px}
.cta h2{color:#fff;margin-bottom:16px}
.foot{margin-top:70px;border-top:1px solid var(--border);padding-top:28px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px;font-size:14px}
@media(max-width:700px){.foot{grid-template-columns:1fr 1fr}}
.foot h4{margin:0 0 8px;font-size:14px}.foot a{display:block;color:var(--muted);padding:3px 0;cursor:pointer}.foot a:hover{color:var(--primary)}
.legal{color:var(--muted);font-size:12.5px;margin-top:22px;text-align:center}
/* game */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{height:100px;border-radius:14px;border:2px solid var(--border);background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:800;font-size:24px;cursor:pointer;padding:8px;overflow:hidden;line-height:1.25}
.tile.open{background:var(--surface2);color:var(--text);border-color:var(--primary);font-size:12.5px;font-weight:600}
.tile.ok{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--text);border-color:var(--good);font-size:12.5px;font-weight:600;cursor:default}
</style>
</head>

/* ============ Util ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function md(src) {
  const lines = esc(src).split('\n'); let out = '', inList = false;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
  for (let l of lines) {
    if (/^\s*[-*•]\s+/.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(l.replace(/^\s*[-*•]\s+/, '')) + '</li>'; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (/^###\s/.test(l)) out += '<h4>' + inline(l.slice(4)) + '</h4>';
    else if (/^#{1,2}\s/.test(l)) out += '<h3>' + inline(l.replace(/^#{1,2}\s/, '')) + '</h3>';
    else if (l.trim()) out += '<p>' + inline(l) + '</p>';
  }
  if (inList) out += '</ul>';
  return out;
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============ State ============ */
const KEY = 'studify:v1';
let S = { materials: [], activeId: null, xp: 0, streak: 0, lastDay: '', cards: {}, summaries: {}, podcasts: {}, chats: {}, quizzes: {}, focusDone: 0, theme: '' };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const level = () => Math.floor(S.xp / 100) + 1;
function topChips() { $('#chipXP').textContent = `⭐ Lv ${level()} · ${S.xp} XP`; $('#chipStreak').textContent = `🔥 ${S.streak} hari`; }
function addXP(n, why) {
  const today = new Date().toISOString().slice(0, 10);
  if (S.lastDay !== today) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak = S.lastDay === y ? S.streak + 1 : 1; S.lastDay = today;
  }
  const lv = level(); S.xp += n; save(); topChips();
  toast(`+${n} XP${why ? ' · ' + why : ''}` + (level() > lv ? ` 🎉 Naik ke Level ${level()}!` : ''));
}
const mat = () => S.materials.find(m => m.id === S.activeId) || null;
const matText = m => m.text.slice(0, 14000);

/* ============ AI (runtime capability: sample) ============ */
let AI = null;
async function getAI() {
  if (AI) return AI;
  try { if (window.claude && window.claude.use) AI = await window.claude.use('sample'); } catch (e) { AI = null; }
  return AI;
}
getAI();
function aiError(e) {
  const c = e && e.code;
  if (c === 'not_granted') toast('Izin AI belum diberikan. Setujui permintaan akses AI untuk memakai fitur ini.');
  else if (c === 'rate_limited') toast('Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.');
  else toast('AI sedang bermasalah. Coba lagi ya.');
  console.error(e);
}
async function needAI() {
  const a = await getAI();

}
const ctxBlock = m => `Judul materi: ${m.title}\n\nISI MATERI:\n"""\n${matText(m)}\n"""`;

const SAMPLE = { title: 'Contoh: Fotosintesis', text: `Slide 1: Fotosintesis\nFotosintesis adalah proses tumbuhan, alga, dan beberapa bakteri mengubah energi cahaya menjadi energi kimia berupa glukosa. Persamaan umum: 6CO2 + 6H2O + cahaya -> C6H12O6 + 6O2.\nSlide 2: Tempat terjadinya\nFotosintesis berlangsung di kloroplas. Di dalamnya ada tilakoid (tumpukan disebut grana) dan stroma. Klorofil pada membran tilakoid menyerap cahaya merah dan biru, memantulkan hijau.\nSlide 3: Reaksi terang\nTerjadi di membran tilakoid. Cahaya memecah air (fotolisis) menghasilkan O2, ATP, dan NADPH. Membutuhkan cahaya secara langsung.\nSlide 4: Siklus Calvin (reaksi gelap)\nTerjadi di stroma. CO2 difiksasi oleh enzim RuBisCO menjadi senyawa 3-karbon, lalu direduksi memakai ATP dan NADPH menjadi G3P yang menjadi glukosa. Tidak butuh cahaya langsung, tetapi bergantung produk reaksi terang.\nSlide 5: Faktor yang memengaruhi\nIntensitas cahaya, konsentrasi CO2, suhu, dan ketersediaan air. Suhu terlalu tinggi dapat merusak enzim sehingga laju fotosintesis turun.\nSlide 6: Pentingnya\nMenghasilkan oksigen, menjadi dasar rantai makanan, dan menyerap CO2 atmosfer sehingga berperan dalam keseimbangan iklim.` };
async function readPptx(file) {
  if (!window.JSZip) throw new Error('JSZip tidak termuat');
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const names = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => parseInt(a.match(/(\d+)\.xml/)[1]) - parseInt(b.match(/(\d+)\.xml/)[1]));
  let out = [];
  for (let i = 0; i < names.length; i++) {
    const xml = await zip.files[names[i]].async('string');
    const paras = [...xml.matchAll(/<a:p[ >][\s\S]*?<\/a:p>/g)].map(p => [...p[0].matchAll(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g)].map(t => t[1]).join('')).filter(Boolean);
    const decoded = paras.join('\n').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
    if (decoded.trim()) out.push(`Slide ${i + 1}:\n${decoded}`);
  }
  return out.join('\n\n');
}

}

/* ============ Fokus (Pomodoro) ============ */
let tm = { mode: 'fokus', left: 25 * 60, total: 25 * 60, run: false, id: null };
const MODES = { fokus: 25 * 60, istirahat: 5 * 60 };
function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function paintTimer() {
  const t = $('#tmT'); if (!t) return; t.textContent = fmt(tm.left);
  const c = 2 * Math.PI * 100; $('#tmR').setAttribute('stroke-dashoffset', c * (1 - tm.left / tm.total));
  document.title = tm.run ? `${fmt(tm.left)} · Studify` : 'Studify – Belajar Lebih Pintar dengan AI';
}
function tick() {
  tm.left--;
  if (tm.left <= 0) {
    clearInterval(tm.id); tm.run = false;
    if (tm.mode === 'fokus') { S.focusDone++; save(); addXP(25, 'sesi fokus selesai'); bump('fokus'); }
    toast(tm.mode === 'fokus' ? '🎉 Sesi selesai! Waktunya istirahat.' : '☕ Istirahat selesai!');
    tm.mode = tm.mode === 'fokus' ? 'istirahat' : 'fokus'; tm.left = tm.total = MODES[tm.mode];
    if (tab === 'fokus') vFokus();
  }
  paintTimer();
}
function vFokus() {
  const c = 2 * Math.PI * 100;
  $('#view').innerHTML = `<h2>⏱️ Mode Fokus</h2><p class="sub">Teknik Pomodoro: 25 menit fokus, 5 menit istirahat. Selesaikan sesi untuk +25 XP.</p>
  <div class="card" style="text-align:center"><div class="row" style="justify-content:center"><span class="pill ${tm.mode === 'fokus' ? 'on' : ''}" data-md="fokus">🎯 Fokus</span><span class="pill ${tm.mode === 'istirahat' ? 'on' : ''}" data-md="istirahat">☕ Istirahat</span></div>
  <div class="ring"><svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle id="tmR" cx="110" cy="110" r="100" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg><div class="t" id="tmT"></div></div>
  <div class="row" style="justify-content:center"><button class="btn" id="tmGo">${tm.run ? '⏸ Jeda' : '▶ Mulai'}</button><button class="btn ghost" id="tmRs">↺ Reset</button></div>
  <p class="note" style="margin-top:14px">Sesi fokus selesai total: <b>${S.focusDone}</b></p></div>`;
  paintTimer();
  document.querySelectorAll('.pill[data-md]').forEach(p => p.onclick = () => { clearInterval(tm.id); tm = { mode: p.dataset.md, left: MODES[p.dataset.md], total: MODES[p.dataset.md], run: false, id: null }; vFokus(); });
  $('#tmGo').onclick = () => { if (tm.run) { clearInterval(tm.id); tm.run = false; } else { tm.run = true; tm.id = setInterval(tick, 1000); } vFokus(); };
  $('#tmRs').onclick = () => { clearInterval(tm.id); tm.run = false; tm.left = tm.total; vFokus(); };
}

function todayM() { const d = new Date().toISOString().slice(0, 10); if (!S.m || S.m.day !== d) S.m = { day: d }; return S.m; }
function bump(k) { const m = todayM(); const need = MISI.find(x => x[0] === k)[1]; const before = m[k] || 0; m[k] = before + 1; save(); if (before < need && m[k] >= need) setTimeout(() => addXP(10, 'misi selesai ✅'), 700); }

/* ============ Game: Cocokkan Kartu ============ */
let gm = null;
const cut = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function startGame(deck, mid) {
  const pick = shuffle(deck).slice(0, 6);
  const tiles = shuffle(pick.flatMap(c => [{ id: c.id, t: 'q', txt: cut(c.q, 60) }, { id: c.id, t: 'a', txt: cut(c.a, 70) }])).map((x, i) => ({ ...x, k: i }));
  gm = { mid, tiles, open: [], matched: new Set(), moves: 0, lock: false, start: Date.now(), done: false, total: pick.length };
}
function vGame() {
  const m = mat(); if (!m) return $('#view').innerHTML = `<h2>🎮 Game Cocokkan Kartu</h2>` + needMat('🎮', 'Game');
  const deck = S.cards[m.id] || [];
  if (deck.length < 4) { $('#view').innerHTML = `<h2>🎮 Game Cocokkan Kartu</h2><p class="sub">Pasangkan pertanyaan dengan jawabannya secepat mungkin.</p>${matBar()}<div class="card empty"><div class="em">🃏</div><h3>Butuh minimal 4 flashcard</h3><p>Buat flashcard dulu dari materimu, lalu kembali ke sini.</p><button class="btn" onclick="go('flash')">Buat Flashcard</button></div>`; return; }
  if (!gm || gm.mid !== m.id) startGame(deck, m.id);
  const secs = Math.round(((gm.endAt || Date.now()) - gm.start) / 1000);
  $('#view').innerHTML = `<h2>🎮 Game Cocokkan Kartu</h2><p class="sub">Ketuk dua kotak: satu pertanyaan dan satu jawaban yang cocok.</p>${matBar()}
  <div class="card"><div class="row" style="margin-bottom:12px"><b>Pasangan: ${gm.matched.size}/${gm.total}</b><span class="note">Langkah: ${gm.moves}</span><div class="grow"></div><button class="btn ghost sm" id="gmNew">🔄 Acak ulang</button></div>
  ${gm.done ? `<div class="empty"><div class="em">🏆</div><h3>Menang dalam ${gm.moves} langkah (${secs} detik)!</h3><button class="btn" id="gmAgain">Main lagi</button></div>` : `<div class="tiles">${gm.tiles.map(t => { const ok = gm.matched.has(t.id), op = gm.open.includes(t.k); return `<button class="tile ${ok ? 'ok' : op ? 'open' : ''}" data-k="${t.k}">${ok || op ? esc(t.txt) : '?'}</button>`; }).join('')}</div>`}</div>`;
  const again = () => { startGame(deck, m.id); vGame(); };
  $('#gmNew').onclick = again; const ag = $('#gmAgain'); if (ag) ag.onclick = again;
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, t = gm.tiles[k];
    if (gm.lock || gm.matched.has(t.id) || gm.open.includes(k)) return;
    gm.open.push(k);
    if (gm.open.length === 2) {
      gm.moves++; const [a, c] = gm.open.map(i => gm.tiles[i]);
      if (a.id === c.id && a.t !== c.t) {
        gm.matched.add(a.id); gm.open = [];
        if (gm.matched.size === gm.total) { gm.done = true; gm.endAt = Date.now(); addXP(20, 'game dimenangkan'); bump('game'); }
      } else { gm.lock = true; setTimeout(() => { if (!gm) return; gm.open = []; gm.lock = false; if (tab === 'game') vGame(); }, 900); }
    }
    vGame();
  });
}

  <section class="sec" id="faq"><h2>Pertanyaan yang sering ditanya</h2><p class="sub"></p>
    <details class="faq"><summary>Materi apa saja yang bisa diunggah?</summary><p>File PowerPoint (.pptx), teks (.txt), Markdown (.md), atau teks yang kamu tempel langsung. Format .ppt lama dan PDF belum didukung, dan slide yang isinya hanya gambar tidak bisa dibaca teksnya.</p></details>
    <details class="faq"><summary>Data dan materi saya aman?</summary><p>Materi, kartu, dan progresmu disimpan di browser perangkatmu sendiri. Saat kamu menekan tombol AI, teks materi dikirim ke Claude untuk diproses, jadi hindari mengunggah data pribadi.</p></details>
    <details class="faq"><summary>Apakah hasil AI selalu benar?</summary><p>Tidak selalu. Anggap hasilnya sebagai pendamping belajar dan cocokkan lagi dengan slide atau buku dosenmu untuk hal-hal penting.</p></details>
    <details class="faq"><summary>Kok gratis? Nanti tiba-tiba bayar?</summary><p>Studify ini adalah demo yang bisa kamu pakai gratis tanpa daftar akun.</p></details>
    <details class="faq"><summary>Suara podcastnya dari mana?</summary><p>Memakai suara bawaan browser atau perangkatmu. Kualitas suara bahasa Indonesia berbeda di tiap perangkat, tapi naskahnya selalu bisa dibaca.</p></details>
    <details class="faq"><summary>Kalau ujian tinggal besok, masih sempat?</summary><p>Sempat. Unggah slide, buat catatan singkat, lalu langsung kerjakan kuis dan flashcard untuk bagian yang paling lemah.</p></details>
    <details class="faq"><summary>Bisa dipakai di HP?</summary><p>Bisa. Tampilannya menyesuaikan layar ponsel dan mendukung mode gelap.</p></details>
