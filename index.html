<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff;--side:#f7f6f3;--surface:#ffffff;--soft:#f4f3ef;--hover:#ecebe6;--text:#2f2e2b;--muted:#8a877f;--border:#e8e6df;
  --primary:#5b4bf5;--primary-soft:#eeedff;--accent:#ff8a3d;--good:#1f9d63;--bad:#e5484d;--warn:#f5a524;
  --shadow:0 4px 18px rgba(30,25,80,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#191919;--side:#202020;--surface:#232323;--soft:#2a2a2a;--hover:#333;--text:#ececec;--muted:#9b9b9b;--border:#343434;--primary:#8f84ff;--primary-soft:#2b2850;--shadow:0 4px 18px rgba(0,0,0,.45);}
}
:root[data-theme="dark"]{--bg:#191919;--side:#202020;--surface:#232323;--soft:#2a2a2a;--hover:#333;--text:#ececec;--muted:#9b9b9b;--border:#343434;--primary:#8f84ff;--primary-soft:#2b2850;--shadow:0 4px 18px rgba(0,0,0,.45);}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0 0 8px;letter-spacing:-.4px}
h2{font-size:26px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px}
.note{font-size:13px;color:var(--muted)}
.grow{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.app{display:flex;min-height:100vh}
.mainwrap{flex:1;min-width:0}
/* sidebar */
.side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;overflow-y:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:2px}
.sbuser{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;margin-bottom:6px}
.sbuser:hover{background:var(--hover)}
.sbuser small{display:block;color:var(--muted);font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.si2{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--muted);margin-bottom:8px;font-size:14px}
kbd{font:inherit;font-size:11px;border:1px solid var(--border);border-radius:6px;padding:0 6px;margin-left:auto;color:var(--muted)}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;font-size:14.5px;color:var(--text)}
.nv span{width:22px;text-align:center}
.nv:hover{background:var(--hover)}
.nv.on{background:var(--primary-soft);color:var(--primary)}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const cut = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet"><button class="x" onclick="closeModal()" aria-label="Tutup">✕</button>${html}</div>`; m.hidden = false; m.onclick = e => { if (e.target === m) closeModal(); }; }
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
function confirmModal(msg, fn) { window._cf = () => { closeModal(); fn(); }; modal(`<h3>Yakin?</h3><p>${msg}</p><div class="row"><button class="btn bad" onclick="_cf()">Ya, lanjutkan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>`); }

let _pdfP = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  if (_pdfP) return _pdfP;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  _pdfP = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = base + 'pdf.min.js';
    sc.onload = async () => {

        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
        res();
      } catch (e) { rej(new Error('pdflib')); }
    };
    sc.onerror = () => rej(new Error('pdflib'));
    document.head.appendChild(sc);
  }).catch(e => { _pdfP = null; throw e; });

}
function mergeLines(lines) {
  const out = [];
  lines.forEach(l => {
    const prev = out[out.length - 1];
    if (prev && prev.length > 55 && !/[.:;!?]$/.test(prev) && /^[a-z(]/.test(l) && !/^([-•●▪*]|\d+[.)])\s/.test(l)) out[out.length - 1] = prev + ' ' + l;
    else out.push(l);

}
async function readPdf(file) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    const its = tc.items.filter(t => t.str && t.str.trim()).map(t => ({ s: t.str, x: t.transform[4], y: t.transform[5] }));
    its.sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    its.forEach(t => { const r = rows[rows.length - 1]; if (r && Math.abs(r.y - t.y) <= 3) r.p.push(t); else rows.push({ y: t.y, p: [t] }); });
    const txt = rows.map(r => r.p.sort((a, b) => a.x - b.x).map(t => t.s).join(' ').replace(/\s+/g, ' ').trim()).filter(x => x && !/^\d{1,3}$/.test(x));
    const paras = mergeLines(txt); if (paras.length) pages.push(paras);
  }
  if (!pages.length) throw new Error('scan');
  return pages;
}
function textSections(t) {
  const secs = []; let cur = null, heads = 0;
  t.split(/\r?\n/).forEach(raw => {
    const l = raw.trim(); if (!l) return; let m;
    if ((m = l.match(/^#{1,3}\s+(.*)/))) { heads++; cur = [m[1].trim()]; secs.push(cur); return; }
    const x = l.replace(/^>\s?/, '').replace(/^([-*•]|\d+[.)])\s+/, '').trim(); if (!x) return;
    if (!cur) { cur = []; secs.push(cur); } cur.push(x);
  });
  if (!heads) { const all = secs.flat(), out = []; for (let i = 0; i < all.length; i += 8) out.push(all.slice(i, i + 8)); return out; }
  return secs;
}
async function readSource(f) {

const BUL = /^[•●▪▫◦‣∙·*-]\s+/;

function makeLesson(group, kind, a, b) {

  t = cut(t.replace(BUL, ''), 70);

  group.forEach((sec, si) => {

      paras.push(x);

      if (isB || (x.length <= 130 && !/[.!?]$/.test(x))) (ul = ul || []).push(x);

    const z = s.replace(/[.]+$/, ''); let m;
    if ((m = z.match(/^(.{3,70}?)\s+(adalah|merupakan|ialah|berarti)\s+(.{12,260})$/i))) return add(m[1], m[3], m[2].toLowerCase());
    if ((m = z.match(/^([^:]{2,50}):\s*(.{12,260})$/))) return add(m[1], m[2], 'yaitu');
    if ((m = z.match(/^(.{2,50}?)\s[-–—]\s(.{15,260})$/))) return add(m[1], m[2], 'yaitu');
  }));
  return out;
}
function makePool(paras) {
  const words = new Set();
  paras.forEach(p => (p.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ-]{5,}/g) || []).forEach(w => { if (!STOP.has(w.toLowerCase())) words.add(w); }));
  return { facts: pickFacts(paras), words: [...words] };
}
function genQuestions(paras, pool, n) {
  const F = [], C = [];
  shuffle(pickFacts(paras)).forEach((f, i) => {
    const others = shuffle(pool.facts.filter(x => x.t.toLowerCase() !== f.t.toLowerCase()));
    const ex = `${f.t} ${f.v} ${f.d}.`;
    if (i % 2 === 0) {
      const ans = cut(f.d, 130), ds = [];
      others.forEach(o => { const d = cut(o.d, 130); if (ds.length < 3 && d !== ans && !ds.includes(d)) ds.push(d); });
      if (ds.length < 2) return;
      const o = shuffle([ans, ...ds]); F.push({ q: `Apa yang dimaksud dengan “${f.t}”?`, o, a: o.indexOf(ans), e: ex });
    } else {
      const ts = []; others.forEach(o => { if (ts.length < 3 && !ts.includes(o.t)) ts.push(o.t); });
      if (ts.length < 2) return;
      const o = shuffle([f.t, ...ts]); F.push({ q: `Pernyataan “${cut(f.d, 160)}” paling tepat menggambarkan …`, o, a: o.indexOf(f.t), e: ex });
    }
  });
  shuffle(paras.flatMap(sents)).forEach(s => {
    if (s.length < 45 || s.length > 220 || /[?]$/.test(s)) return;
    const ws = (s.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ-]{5,}/g) || []).filter(w => !STOP.has(w.toLowerCase())).sort((a, b) => b.length - a.length);
    if (!ws.length) return;
    const w = ws[Math.floor(Math.random() * Math.min(2, ws.length))], cap = /^[A-ZÀ-Þ]/.test(w);
    const ds = shuffle(pool.words.filter(x => x.toLowerCase() !== w.toLowerCase() && /^[A-ZÀ-Þ]/.test(x) === cap && Math.abs(x.length - w.length) <= 5)).slice(0, 3);
    if (ds.length < 2) return;
    const o = shuffle([w, ...ds]), at = s.indexOf(w);
    C.push({ q: `Lengkapi kalimat: “${s.slice(0, at)}_____${s.slice(at + w.length)}”`, o, a: o.indexOf(w), e: 'Kalimat lengkap: ' + s });
  });
  const out = []; let i = 0, j = 0;
  while (out.length < n && (i < F.length || j < C.length)) { if (i < F.length) out.push(F[i++]); if (out.length < n && j < C.length) out.push(C[j++]); }
  return out.slice(0, n);
}
function genTryout(parts, pool, n) {
  parts = parts.filter(p => p.length); if (!parts.length) return [];
  const per = Math.ceil(n / parts.length) + 1, seen = new Set(), all = [];
  parts.forEach(p => genQuestions(p, pool, per).forEach(q => { if (!seen.has(q.q)) { seen.add(q.q); all.push(q); } }));
  return shuffle(all).slice(0, n);
}

/* ================= Runner kuis ================= */
let run = null;
function startRun(title, qs, key, backFn) {
  run = { title, key, src: qs, backFn, i: 0, score: 0, picked: null, done: false, qs: shuffle(qs).map(q => ({ q: q.q, e: q.e || '', o: shuffle(q.o.map((t, k) => ({ t, ok: k === q.a }))) })) };
  go('run');
}
function vRun() {
  if (!run) { $('#view').innerHTML = '<div class="empty"><div class="em">🧠</div>Tidak ada kuis yang sedang berjalan.<br><br><button class="btn" onclick="go(\'kuis\')">Ke Kuis</button></div>'; return; }
  let body;
  if (run.done) {
    const pct = Math.round(run.score / run.qs.length * 100);
    body = `<div class="empty"><div class="em">${pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪'}</div><h3>Skor: ${run.score}/${run.qs.length} (${pct}%)</h3><p>${pct >= 80 ? 'Luar biasa! Kamu menguasai materi ini.' : pct >= 50 ? 'Lumayan! Ulangi untuk bagian yang meleset.' : 'Jangan menyerah, baca materinya lagi lalu coba ulang.'}</p><div class="row" style="justify-content:center"><button class="btn" onclick="startRun(run.title,run.src,run.key,run.backFn)">Ulangi</button><button class="btn ghost" onclick="run.backFn()">Selesai</button></div></div>`;
  } else {
    const q = run.qs[run.i];
    body = `<div class="row"><b>Soal ${run.i + 1}/${run.qs.length}</b><div class="grow bar2"><i style="width:${run.i / run.qs.length * 100}%"></i></div></div><h3 style="margin-top:14px">${esc(q.q)}</h3>
    ${q.o.map((o, k) => `<button class="opt ${run.picked != null ? (o.ok ? 'ok' : k === run.picked ? 'no' : '') : ''}" ${run.picked != null ? 'disabled' : ''} onclick="runPick(${k})">${'ABCD'[k]}. ${esc(o.t)}</button>`).join('')}
    ${run.picked != null ? `<div class="tip">${q.o[run.picked].ok ? '✅ Benar! ' : '❌ Kurang tepat. '}${esc(q.e)}</div><div style="margin-top:12px"><button class="btn" onclick="runNext()">${run.i + 1 >= run.qs.length ? 'Lihat hasil' : 'Lanjut →'}</button></div>` : ''}`;
  }
  $('#view').innerHTML = `<div class="crumb"><a onclick="run.backFn()">← Keluar</a></div><h2>${esc(run.title)}</h2><div class="card" style="margin-top:12px">${body}</div>`;
}
function runPick(k) { if (run.picked != null) return; run.picked = k; if (run.qs[run.i].o[k].ok) { run.score++; addXP(5); } vRun(); }
function runNext() {
  run.i++; run.picked = null;
  if (run.i >= run.qs.length) { run.done = true; const pct = Math.round(run.score / run.qs.length * 100); S.scores[run.key] = Math.max(S.scores[run.key] || 0, pct); S.quizDone++; save(); bump('kuis'); addXP(run.score * 2, 'bonus kuis'); }
  vRun();
}

/* ================= Game ================= */
let gm = null, gmDeck = null;
function startGame(d) { const pick = shuffle(d.cards).slice(0, 6); gm = { did: d.id, tiles: shuffle(pick.flatMap(c => [{ id: c.id, t: 'q', txt: cut(c.q, 60) }, { id: c.id, t: 'a', txt: cut(c.a, 70) }])).map((x, i) => ({ ...x, k: i })), open: [], matched: new Set(), moves: 0, lock: false, start: Date.now(), done: false, total: pick.length }; }
function vGame() {
  const ok = S.decks.filter(d => d.cards.length >= 4);
  let h = `<h2>🎮 Game Cocokkan Kartu</h2><p class="sub">Pasangkan pertanyaan dengan jawabannya dari deck flashcardmu.</p>`;
  if (!ok.length) { $('#view').innerHTML = h + `<div class="card empty"><div class="em">🃏</div><h3>Butuh deck dengan minimal 4 kartu</h3><p>Buat flashcard dulu, lalu kembali ke sini.</p><button class="btn" onclick="go('flash')">Ke Flashcard</button></div>`; return; }
  if (!gmDeck || !ok.find(d => d.id === gmDeck)) gmDeck = ok[0].id;
  const d = ok.find(x => x.id === gmDeck); if (!gm || gm.did !== d.id) startGame(d);
  const secs = Math.round(((gm.endAt || Date.now()) - gm.start) / 1000);
  $('#view').innerHTML = h + `<div class="card"><div class="row" style="margin-bottom:12px"><select id="gmSel" style="width:auto">${ok.map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><b>Pasangan: ${gm.matched.size}/${gm.total}</b><span class="note">Langkah: ${gm.moves}</span><div class="grow"></div><button class="btn ghost sm" id="gmNew">🔄 Acak ulang</button></div>
  ${gm.done ? `<div class="empty"><div class="em">🏆</div><h3>Menang dalam ${gm.moves} langkah (${secs} detik)!</h3><button class="btn" id="gmAgain">Main lagi</button></div>` : `<div class="tiles">${gm.tiles.map(t => { const m = gm.matched.has(t.id), op = gm.open.includes(t.k); return `<button class="tile ${m ? 'ok' : op ? 'open' : ''}" data-k="${t.k}">${m || op ? esc(t.txt) : '?'}</button>`; }).join('')}</div>`}</div>`;
  const again = () => { startGame(d); vGame(); };
  $('#gmNew').onclick = again; const ag = $('#gmAgain'); if (ag) ag.onclick = again;
  $('#gmSel').onchange = e => { gmDeck = e.target.value; gm = null; vGame(); };
  $$('.tile').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, t = gm.tiles[k]; if (gm.lock || gm.matched.has(t.id) || gm.open.includes(k)) return; gm.open.push(k);
    if (gm.open.length === 2) {
      gm.moves++; const [a, c] = gm.open.map(i => gm.tiles[i]);
      if (a.id === c.id && a.t !== c.t) { gm.matched.add(a.id); gm.open = []; if (gm.matched.size === gm.total) { gm.done = true; gm.endAt = Date.now(); addXP(20, 'game dimenangkan'); } }
      else { gm.lock = true; setTimeout(() => { if (!gm) return; gm.open = []; gm.lock = false; if (tab === 'game') vGame(); }, 900); }
    }
    vGame();
  });
}

/* ================= Fokus ================= */
let tm = { min: 25, mode: 'fokus', left: 25 * 60, total: 25 * 60, run: false, id: null };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function paintTimer() { const t = $('#tmT'); if (!t) return; t.textContent = fmt(tm.left); $('#tmR').setAttribute('stroke-dashoffset', 2 * Math.PI * 100 * (1 - tm.left / tm.total)); document.title = tm.run ? `${fmt(tm.left)} · Studify` : 'Studify – Belajar, Mencatat, Latihan'; }
function tick() {
  tm.left--;
  if (tm.left <= 0) {
    clearInterval(tm.id); tm.run = false;
    if (tm.mode === 'fokus') { S.focusDone++; save(); addXP(25, 'sesi fokus selesai'); bump('fokus'); }
    toast(tm.mode === 'fokus' ? '🎉 Sesi selesai! Waktunya istirahat.' : '☕ Istirahat selesai!');
    tm.mode = tm.mode === 'fokus' ? 'istirahat' : 'fokus'; tm.total = tm.left = tm.mode === 'fokus' ? tm.min * 60 : 5 * 60;

}
function vFokus() {
  const c = 2 * Math.PI * 100;
  $('#view').innerHTML = `<h2>⏱️ Mode Fokus</h2><p class="sub">Teknik Pomodoro: fokus penuh, lalu istirahat 5 menit. Sesi fokus selesai memberi +25 XP.</p>

  <div class="note" style="margin-top:8px">${tm.mode === 'fokus' ? '🎯 Waktu fokus' : '☕ Waktu istirahat'}</div>

  <div class="row" style="justify-content:center"><button class="btn lg" id="tmGo">${tm.run ? '⏸ Jeda' : '▶ Mulai'}</button><button class="btn ghost lg" id="tmRs">↺ Reset</button></div>
  <p class="note" style="margin-top:14px">Total sesi fokus selesai: <b>${S.focusDone}</b></p></div>`;

/* ================= Kalkulator IPK ================= */
const GR = { 'A': 4, 'A-': 3.7, 'B+': 3.3, 'B': 3, 'B-': 2.7, 'C+': 2.3, 'C': 2, 'D': 1, 'E': 0 };
function ipkCalc() { const rows = S.gpa.filter(r => +r.sks > 0); const sks = rows.reduce((a, r) => a + +r.sks, 0); const pts = rows.reduce((a, r) => a + +r.sks * GR[r.g], 0); return { sks, ipk: sks ? (pts / sks) : 0 }; }
function ipkPaint() { const r = ipkCalc(); const e = $('#ipkRes'); if (e) e.innerHTML = `<div class="stat"><b>${r.ipk.toFixed(2)}</b><span>IPK / IPS</span></div><div class="stat"><b>${r.sks}</b><span>Total SKS</span></div>`; }
function vIpk() {
  if (!S.gpa.length) S.gpa.push({ id: uid(), n: '', sks: 3, g: 'A' });
  $('#view').innerHTML = `<h2>🧮 Kalkulator IPK</h2><p class="sub">Masukkan mata kuliah, SKS, dan nilai huruf (skala 4.0).</p>
  <div class="card"><div class="row" style="gap:30px;margin-bottom:14px" id="ipkRes"></div>
  <div id="ipkRows">${S.gpa.map(r => `<div class="ipkrow" data-id="${r.id}"><input type="text" data-f="n" placeholder="Mata kuliah" value="${esc(r.n)}"><input type="number" data-f="sks" min="0" max="10" value="${r.sks}"><select data-f="g">${Object.keys(GR).map(g => `<option ${g === r.g ? 'selected' : ''}>${g}</option>`).join('')}</select><button class="iconbtn" onclick="ipkDel('${r.id}')">✕</button></div>`).join('')}</div>
  <div class="row"><button class="btn ghost" onclick="S.gpa.push({id:uid(),n:'',sks:3,g:'A'});save();vIpk()">＋ Tambah mata kuliah</button><button class="btn ghost" onclick="S.gpa=[];save();vIpk()">Kosongkan</button></div></div>`;
  ipkPaint();
  $('#ipkRows').oninput = e => { const row = e.target.closest('.ipkrow'); if (!row) return; const r = S.gpa.find(x => x.id === row.dataset.id); r[e.target.dataset.f] = e.target.value; saveSoon(); ipkPaint(); };
}
function ipkDel(id) { S.gpa = S.gpa.filter(r => r.id !== id); save(); vIpk(); }

/* ================= Profil ================= */
function vProfil() {
  const cards = S.decks.reduce((a, d) => a + d.cards.length, 0);
  $('#view').innerHTML = `<h2>👤 Profil & Pengaturan</h2>
  <div class="card row" style="gap:16px"><div class="avatar" style="width:60px;height:60px;font-size:26px">${esc((S.name || 'T')[0].toUpperCase())}</div><div class="grow"><b style="font-size:20px">${esc(S.name || 'Tamu')}</b><div class="note">Level ${level()} · ${S.xp} XP · 🔥 ${S.streak} hari</div></div><button class="btn ghost sm" onclick="editProfile()">Ubah</button></div>
  <div class="grid g4" style="margin-top:14px"><div class="card stat"><b>${Object.keys(S.done).length}</b><span>Materi selesai</span></div><div class="card stat"><b>${S.notes.length}</b><span>Catatan</span></div><div class="card stat"><b>${cards}</b><span>Flashcard</span></div><div class="card stat"><b>${S.focusDone}</b><span>Sesi fokus</span></div></div>
  <div class="sect"><h3>🏅 Lencana</h3></div><div class="grid g4">${BADGES.map(([k, e, n, d]) => `<div class="badge ${S.badges[k] ? '' : 'off'}"><div class="em">${e}</div><b style="font-size:13px">${n}</b><small>${d}</small></div>`).join('')}</div>
  <div class="sect"><h3>⚙️ Data</h3></div><div class="card"><p class="note" style="margin-top:0">Semua data tersimpan di browser perangkat ini. Salin cadangan agar bisa dipulihkan di perangkat lain.</p>
  <div class="row"><button class="btn ghost" onclick="exportData()">📋 Salin cadangan</button><button class="btn ghost" onclick="importModal()">📥 Pulihkan</button><button class="btn bad" onclick="resetAll()">🗑️ Hapus semua data</button></div></div>`;
}
function editProfile() { modal(`<h3>Ubah profil</h3><div class="fld"><label>Nama panggilan</label><input type="text" id="pfName" value="${esc(S.name)}" maxlength="30"></div><div class="fld"><label>Jalur belajar</label><select id="pfTr">${[['kuliah', 'Kuliah'], ['sekolah', 'Sekolah'], ['ptn', 'Persiapan PTN'], ['asn', 'Calon ASN']].map(([k, l]) => `<option value="${k}" ${S.track === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div><button class="btn" onclick="S.name=val('pfName').trim()||S.name;S.track=val('pfTr');save();closeModal();renderAll()">Simpan</button>`); }
function exportData() { try { navigator.clipboard.writeText(JSON.stringify(S)); toast('Cadangan disalin ke clipboard'); } catch (e) { modal(`<h3>Cadangan</h3><textarea style="min-height:160px" readonly onclick="this.select()">${esc(JSON.stringify(S))}</textarea>`); } }
function importModal() { modal(`<h3>Pulihkan cadangan</h3><p class="note">Tempel teks cadangan. Data saat ini akan diganti.</p><textarea id="impT" style="min-height:140px"></textarea><button class="btn" style="margin-top:10px" onclick="doImport()">Pulihkan</button>`); }
function doImport() { try { const o = JSON.parse(val('impT')); if (!o || !Array.isArray(o.notes)) throw 0; S = Object.assign(defaults(), o); save(); closeModal(); toast('Data dipulihkan'); renderAll(); } catch (e) { toast('Cadangan tidak valid.'); } }
function resetAll() { confirmModal('Semua catatan, kartu, kuis, tugas, dan progres akan dihapus permanen.', () => { S = defaults(); seed(); save(); go('landing'); }); }

/* ================= Pencarian ================= */
function openSearch() { modal(`<h3>Cari</h3><input type="text" id="sq" placeholder="Cari catatan, materi, kartu, tugas…" autocomplete="off"><div id="sres" style="margin-top:12px"></div>`); const i = $('#sq'); i.focus(); i.oninput = paintSearch; paintSearch(); }
function paintSearch() {
  const q = val('sq').trim().toLowerCase(); const r = []; if (!q) { $('#sres').innerHTML = '<div class="note">Ketik untuk mencari di seluruh Studify.</div>'; return; }
  S.notes.forEach(n => { if ((n.title || '').toLowerCase().includes(q) || noteText(n).includes(q)) r.push([n.icon, n.title || 'Tanpa judul', 'Catatan', `go('notes',{n:'${n.id}'})`]); });
  allLessons().forEach(({ c, l }) => { if (l.t.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)) r.push([c.emoji, l.t, 'Kelas · ' + c.name, `go('kelas',{s:'${c.id}',l:'${l.id}'})`]); });
  S.decks.forEach(d => { if (d.name.toLowerCase().includes(q) || d.cards.some(c => (c.q + ' ' + c.a).toLowerCase().includes(q))) r.push(['🃏', d.name, 'Flashcard', `go('flash',{d:'${d.id}'})`]); });
  S.tasks.forEach(t => { if (t.x.toLowerCase().includes(q)) r.push(['✅', t.x, 'Tugas', "go('planner')"]); });
  $('#sres').innerHTML = r.slice(0, 12).map(x => `<div class="item click" onclick="${x[3]}"><div class="ico">${x[0]}</div><div class="grow"><b>${esc(cut(x[1], 50))}</b><br><small>${esc(x[2])}</small></div></div>`).join('') || '<div class="note">Tidak ada hasil.</div>';
}

/* ================= Init ================= */
$('#themeBtn').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; S.theme = nx; save(); };
if (S.theme) document.documentElement.dataset.theme = S.theme;
$$('[data-logo]').forEach(i => i.src = LOGO);
$('#lnav').innerHTML = [['kelas-lp', 'Kelas'], ['fitur', 'Fitur'], ['faq', 'FAQ']].map(([id, l]) => `<a onclick="scrollToSec('${id}')">${l}</a>`).join('') + `<button class="btn dark sm" style="margin-left:8px" onclick="startApp()">Mulai Belajar</button>`;
tab = S.name ? 'home' : 'landing';
renderAll();
</script>
</body>
</html>
